[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "govee-hygrometer-ble"
version = "0.1.0"
description = "Read a Govee H5075 over Bluetooth and publish it to Home Assistant via MQTT"
requires-python = ">=3.10"
dependencies = [
  "bleak>=0.22,<2",
  "paho-mqtt>=2,<3",
]

[project.scripts]
govee-hygrometer = "govee_hygrometer.collector:main"

[tool.setuptools.packages.find]
where = ["src"]

